on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r ../fscss-acode-plugin.zip . -x ".git/*" ".github/*"
      - run: gh release upload ${{ github.event.release.tag_name }} ../fscss-acode-plugin.zip
        env:
          GH_TOKEN: ${{ github.token }}
